name: AQI Daily Pipeline

on:
  schedule:
    - cron: "0 * * * *"    # every hour - feature pipeline / prediction
    # Daily 6 AM training + drift check is paused due to Hopsworks free-tier
    # compute budget being exhausted. See final report (Section 9.2) for details.
    # Re-enable this line once the budget resets or a paid plan is adopted:
    # - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feature pipeline and prediction
        if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: python -m src.predictor

      - name: Run training pipeline
        # Paused: only runs on manual trigger now, until the Hopsworks
        # compute budget resets.
        if: github.event_name == 'workflow_dispatch'
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: python -m src.train_model

      - name: Run data drift check
        # Paused: only runs on manual trigger now, until the Hopsworks
        # compute budget resets.
        if: github.event_name == 'workflow_dispatch'
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: python -m src.drift_check